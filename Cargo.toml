[package]
name = "keyloom"
version = "0.1.3"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/BlakeGardner/Keyloom"

[dependencies]
evdev = "0.13"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tokio = { version = "1", features = ["process", "time"] }
ureq = "3"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = [
    "a11y",
    "dbus-config",
    "desktop",
    "multi-window",
    "process",
    "tokio",
    "wayland",
    "wgpu",
    "winit",
    "xdg-portal",
]

[dev-dependencies]
# iced's headless test harness, from the iced bundled with libcosmic so
# the two agree on every widget type; the lockfile keeps both at one
# commit (src/app/e2e.rs).
iced_test = { git = "https://github.com/pop-os/libcosmic.git" }
png = "0.18"
