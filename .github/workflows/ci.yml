name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # The recorded xremap release that generated configs are validated
  # against: the pinned binary must load them
  # (generated_documents_parse_with_real_xremap in src/xremap.rs), and
  # the pinned source's own event-handler tests must agree with what the
  # layer documents mean (scripts/verify-layers-with-xremap.sh). Bump
  # deliberately when targeting a new xremap.
  XREMAP_VERSION: 0.15.12

# Cancel in-progress runs when new commits are pushed to the same PR/branch,
# but never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Keep the xremap source checkout out of Keyloom's target/, which
      # rust-cache caches on its own.
      XREMAP_HARNESS_DIR: ${{ runner.temp }}/xremap-harness
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - name: Install pinned xremap for config validation
        run: |
          curl -sSL -o /tmp/xremap.zip "https://github.com/xremap/xremap/releases/download/v${XREMAP_VERSION}/xremap-linux-x86_64-cosmic.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -o /tmp/xremap.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/xremap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/xremap" --version
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Cache the pinned xremap source build for the layer harness
        uses: actions/cache@v4
        with:
          path: ${{ env.XREMAP_HARNESS_DIR }}
          key: xremap-harness-${{ runner.os }}-${{ env.XREMAP_VERSION }}-${{ steps.toolchain.outputs.cachekey }}
      - name: Run tests
        run: cargo test --verbose --locked
      - name: Validate generated configs with pinned xremap
        run: cargo test --verbose --locked xremap::tests::generated_documents_parse_with_real_xremap -- --ignored --exact
      - name: Run generated layer documents through xremap's event handler
        run: ./scripts/verify-layers-with-xremap.sh

  deny:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cargo-deny (advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
          rust-version: stable
