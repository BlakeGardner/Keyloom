name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # The recorded xremap release that generated configs are validated
  # against: the pinned binary must load them
  # (generated_documents_parse_with_real_xremap in src/xremap.rs), and
  # the pinned source's own event-handler tests must agree with what the
  # layer documents mean (scripts/verify-layers-with-xremap.sh). It is
  # also the release first-run setup downloads (install::RELEASE in
  # src/install.rs; a test checks that the two agree). Bump deliberately
  # when targeting a new xremap.
  XREMAP_VERSION: 0.15.13

# Cancel in-progress runs when new commits are pushed to the same PR/branch,
# but never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        # Open Sans is the interface font, so a failed interface test's
        # picture of the window is rendered with it.
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev fonts-open-sans
      - name: Install pinned xremap for config validation
        run: |
          curl -sSL -o /tmp/xremap.zip "https://github.com/xremap/xremap/releases/download/v${XREMAP_VERSION}/xremap-linux-x86_64-full.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -o /tmp/xremap.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/xremap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/xremap" --version
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - uses: Swatinem/rust-cache@v2
      # The xremap source checkout lives in the runner's temp directory,
      # outside Keyloom's target/, which rust-cache caches on its own.
      - name: Cache the pinned xremap source build for the layer harness
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/xremap-harness
          key: xremap-harness-${{ runner.os }}-${{ env.XREMAP_VERSION }}-${{ steps.toolchain.outputs.cachekey }}
      - name: Run tests
        run: cargo test --verbose --locked
      - name: Upload pictures of the windows failed interface tests left
        # A failing interface test pictures the window as it was under
        # target/setup-shots/failures (src/app/e2e.rs).
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-interface-tests
          path: target/setup-shots/failures
          if-no-files-found: ignore
      - name: Validate generated configs with pinned xremap
        run: cargo test --verbose --locked xremap::tests::generated_documents_parse_with_real_xremap -- --ignored --exact
      - name: Check that the release setup downloads is what GitHub serves
        run: cargo test --verbose --locked install::tests::the_pinned_asset_is_what_github_serves -- --ignored --exact
      - name: Run generated layer documents through xremap's event handler
        env:
          XREMAP_HARNESS_DIR: ${{ runner.temp }}/xremap-harness
        run: ./scripts/verify-layers-with-xremap.sh

  deny:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cargo-deny (advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
          rust-version: stable

  screenshots:
    name: Setup screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        # Open Sans is the interface font the screenshots are rendered
        # with; without it the runner would substitute another face.
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev fonts-open-sans
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Render the setup wizard
        # Ignored in the ordinary test run; the software renderer needs
        # no display or GPU (src/app/screenshots.rs).
        run: cargo test --locked screenshots -- --ignored
      - name: Upload the screenshots
        # Also after a failure, for what did render and the picture a
        # failed storyboard leaves under failures/.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: setup-screenshots
          path: target/setup-shots
          if-no-files-found: error
