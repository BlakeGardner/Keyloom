name: Release packages

# Publishing a GitHub release (or running this by hand for an existing
# release) builds Keyloom's source packages (a Debian source package and an
# RPM spec), attaches them to the release, and tells the Open Build Service
# to fetch them from there. OBS builds the .deb packages for every
# configured Debian and Ubuntu release and the .rpm packages for every
# configured Fedora release, and the workflow then attaches those to the
# GitHub release as well. The Arch package is different: it is built right
# here, with makepkg in an Arch container, and attached alongside them.
# OBS fetches GitHub's latest release, so pre-releases are packaged only
# on GitHub. The sources come from the release's tag; the packaging
# recipes and scripts come from the commit this workflow runs on, so an
# older release can be re-run with current packaging. See
# packaging/README.md for the one-time setup.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to package, for example v0.1.0
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  OBS_PROJECT: ${{ vars.OBS_PROJECT }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  source:
    name: Source packages
    # Every release is a Keyloom release except the one carrying the build
    # toolchain.
    if: (github.event.release.tag_name || inputs.tag) != 'rust-toolchain'
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Release tags are the version with a leading v, for example v0.1.0; got $TAG"; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          # The whole history, so that the tag can be archived.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-vendor-filterer
        run: cargo install --locked cargo-vendor-filterer
      - name: Build the source packages
        run: ./scripts/build-source-packages.sh dist --tag "$TAG" --ref "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: source-packages
          path: dist
          if-no-files-found: error

  obs:
    name: Build on the Open Build Service
    needs: source
    runs-on: ubuntu-latest
    # OBS builds several distributions and architectures in turn; the
    # aarch64 workers in particular can take a while.
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      OBS_TOKEN: ${{ secrets.OBS_TOKEN_KEYLOOM }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: source-packages
          path: dist
      - name: Check the release
        id: release
        run: |
          if [ -z "$OBS_PROJECT" ]; then
            echo "Set the OBS_PROJECT repository variable (see packaging/README.md)" >&2
            exit 1
          fi
          if [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = true ]; then
            echo "::notice::$TAG is a pre-release; OBS only fetches GitHub's latest release, so no packages are built for it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "dsc=$(basename dist/*.dsc)" >> "$GITHUB_OUTPUT"
      - name: Attach the source packages to the release
        if: steps.release.outputs.skip != 'true'
        run: |
          (cd dist && tar -cf ../keyloom-source-packages.tar keyloom_* keyloom.spec)
          gh release upload "$TAG" keyloom-source-packages.tar --clobber
      - name: Tell OBS to fetch them
        if: steps.release.outputs.skip != 'true'
        run: ./scripts/obs.py trigger "$OBS_PROJECT" keyloom
      - name: Wait for OBS to take the sources
        if: steps.release.outputs.skip != 'true'
        run: ./scripts/obs.py wait-sources "$OBS_PROJECT" keyloom "${{ steps.release.outputs.dsc }}"
      - name: Wait for the builds
        if: steps.release.outputs.skip != 'true'
        run: ./scripts/obs.py wait-builds "$OBS_PROJECT" keyloom
      - name: Download the packages and attach them to the release
        if: steps.release.outputs.skip != 'true'
        run: |
          ./scripts/obs.py fetch "$OBS_PROJECT" keyloom packages
          gh release upload "$TAG" packages/* --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages
          path: packages
          if-no-files-found: ignore
      # Last, so that a distribution OBS cannot build at the moment (its
      # base system breaks now and then) does not withhold the others.
      - name: Fail if any build did not succeed
        if: steps.release.outputs.skip != 'true'
        run: ./scripts/obs.py check "$OBS_PROJECT" keyloom

  arch:
    name: Arch package
    # Built here rather than on OBS: the AUR is the intended channel once
    # its registration reopens, and until then the release carries a
    # one-off binary, the way it carries one-off .deb and .rpm files.
    # makepkg runs in an Arch container with the recipe from this commit,
    # its pkgver and checksum pointed at the release's tag, so the
    # committed PKGBUILD never needs to be bumped before a release. Needs
    # the source job only for its tag checks; no artifact of it is used.
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: archlinux:latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # gh would otherwise ask git for the repository, and git does not
      # trust the checkout's ownership inside the container.
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        # Container steps default to sh; the attach step uses bash arrays.
        shell: bash
    steps:
      # Only what the job itself uses, before checkout, which needs git
      # inside the container; makepkg --syncdeps installs what the
      # PKGBUILD declares, so its dependencies are never repeated here.
      - name: Install the build environment
        run: pacman -Syu --noconfirm --needed base-devel git github-cli namcap
      - uses: actions/checkout@v7
      - name: Check the release
        id: release
        run: |
          if [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = true ]; then
            echo "::notice::$TAG is a pre-release; like the OBS packages, the Arch package is built only for full releases."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # makepkg refuses to run as root, hence the builder user, allowed
      # sudo pacman so --syncdeps can install the PKGBUILD's dependencies.
      - name: Build the package
        if: steps.release.outputs.skip != 'true'
        run: |
          version=${TAG#v}
          curl -fL -o "keyloom-$version.tar.gz" \
            "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz"
          sha=$(sha256sum "keyloom-$version.tar.gz" | cut -d' ' -f1)
          useradd -m builder
          echo 'builder ALL=(root) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          install -d -o builder /build
          install -o builder -m644 packaging/arch/PKGBUILD /build/PKGBUILD
          install -o builder -m644 "keyloom-$version.tar.gz" "/build/keyloom-$version.tar.gz"
          sed -i "s/^pkgver=.*/pkgver=$version/; s/^sha256sums=.*/sha256sums=('$sha')/" /build/PKGBUILD
          cd /build
          sudo -u builder makepkg --syncdeps --noconfirm
          namcap keyloom-*.pkg.tar.zst || true
      # The glob starting with a digit passes over the -debug package some
      # makepkg configurations split off.
      - name: Install it, as a smoke test
        if: steps.release.outputs.skip != 'true'
        run: |
          pacman -U --noconfirm /build/keyloom-[0-9]*-x86_64.pkg.tar.zst
          ldd /usr/bin/keyloom
      - name: Attach it to the release
        if: steps.release.outputs.skip != 'true'
        run: |
          pkg=(/build/keyloom-[0-9]*-x86_64.pkg.tar.zst)
          name=$(basename "${pkg[0]}" .pkg.tar.zst)_arch.pkg.tar.zst
          cp "${pkg[0]}" "$name"
          gh release upload "$TAG" "$name" --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arch-package
          path: /build/keyloom-[0-9]*-x86_64.pkg.tar.zst
          if-no-files-found: ignore
