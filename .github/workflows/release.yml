name: Release packages

# Publishing a GitHub release (or running this by hand for an existing
# release) builds Keyloom's Debian source package, attaches it to the
# release, and tells the Open Build Service to fetch it from there. OBS
# builds the .deb packages for every configured Debian and Ubuntu release,
# and the workflow then attaches those to the GitHub release as well. OBS
# fetches GitHub's latest release, so pre-releases are packaged only on
# GitHub. See packaging/README.md for the one-time setup.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to package, for example v0.1.0
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  OBS_PROJECT: ${{ vars.OBS_PROJECT }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  source:
    name: Debian source package
    # Only version tags are Keyloom releases; the rust-toolchain release
    # carries the build toolchain.
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-vendor-filterer
        run: cargo install --locked cargo-vendor-filterer
      - name: Build the source package
        run: ./scripts/build-deb-source.sh dist --tag "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: debian-source
          path: dist
          if-no-files-found: error

  obs:
    name: Build on the Open Build Service
    needs: source
    runs-on: ubuntu-latest
    # OBS builds several distributions and architectures in turn; the
    # aarch64 workers in particular can take a while.
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      OBS_TOKEN: ${{ secrets.OBS_TOKEN_KEYLOOM }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: debian-source
          path: dist
      - name: Check the release
        id: release
        run: |
          if [ -z "$OBS_PROJECT" ]; then
            echo "Set the OBS_PROJECT repository variable (see packaging/README.md)" >&2
            exit 1
          fi
          if [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = true ]; then
            echo "::notice::$TAG is a pre-release; OBS only fetches GitHub's latest release, so no packages are built for it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "dsc=$(basename dist/*.dsc)" >> "$GITHUB_OUTPUT"
      - name: Attach the source package to the release
        if: steps.release.outputs.skip != 'true'
        run: |
          (cd dist && tar -cf ../keyloom-debian-source.tar keyloom_*)
          gh release upload "$TAG" keyloom-debian-source.tar --clobber
      - name: Tell OBS to fetch it
        if: steps.release.outputs.skip != 'true'
        run: ./scripts/obs.py trigger "$OBS_PROJECT" keyloom
      - name: Wait for OBS to take the sources
        if: steps.release.outputs.skip != 'true'
        run: ./scripts/obs.py wait-sources "$OBS_PROJECT" keyloom "${{ steps.release.outputs.dsc }}"
      - name: Wait for the builds
        if: steps.release.outputs.skip != 'true'
        run: ./scripts/obs.py wait-builds "$OBS_PROJECT" keyloom
      - name: Download the packages and attach them to the release
        if: steps.release.outputs.skip != 'true'
        run: |
          ./scripts/obs.py fetch "$OBS_PROJECT" keyloom packages
          gh release upload "$TAG" packages/*.deb --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debian-packages
          path: packages
          if-no-files-found: ignore
      # Last, so that a distribution OBS cannot build at the moment (its
      # base system breaks now and then) does not withhold the others.
      - name: Fail if any build did not succeed
        if: steps.release.outputs.skip != 'true'
        run: ./scripts/obs.py check "$OBS_PROJECT" keyloom
