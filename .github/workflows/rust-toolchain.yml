name: Rust toolchain package

# Keyloom's dependencies need a newer Rust than Debian 13 and Ubuntu 24.04
# ship, so the Open Build Service builds Keyloom with upstream's toolchain,
# packaged from packaging/rust-toolchain. This publishes that source
# package on the GitHub pre-release tagged rust-toolchain (a fixed address
# the OBS package fetches from) and tells OBS to fetch it. Run it once when
# setting up the project; it also runs when packaging/rust-toolchain
# changes on main. The Keyloom builds pick up the new package on their
# own. See packaging/README.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packaging/rust-toolchain/**
      - scripts/build-rust-toolchain-source.sh

concurrency:
  group: ${{ github.workflow }}

jobs:
  toolchain:
    name: Publish and build on the Open Build Service
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      OBS_TOKEN: ${{ secrets.OBS_TOKEN_TOOLCHAIN }}
      OBS_PROJECT: ${{ vars.OBS_PROJECT }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the source package
        run: ./scripts/build-rust-toolchain-source.sh dist
      - name: Publish it on the rust-toolchain release
        run: |
          if [ -z "$OBS_PROJECT" ]; then
            echo "Set the OBS_PROJECT repository variable (see packaging/README.md)" >&2
            exit 1
          fi
          (cd dist && tar -cf ../keyloom-rust-toolchain-source.tar keyloom-rust-toolchain_*)
          if ! gh release view rust-toolchain >/dev/null 2>&1; then
            gh release create rust-toolchain --prerelease --target "$GITHUB_SHA" \
              --title "Rust toolchain for package builds" \
              --notes "Not a Keyloom release. This holds the Rust toolchain source package that the Open Build Service uses to build Keyloom's Debian and Ubuntu packages; see packaging/README.md. The asset is replaced whenever the toolchain version changes."
          fi
          gh release upload rust-toolchain keyloom-rust-toolchain-source.tar --clobber
      - name: Tell OBS to fetch it and wait for the builds
        run: |
          version=$(tr -d '[:space:]' < packaging/rust-toolchain/version)
          ./scripts/obs.py trigger "$OBS_PROJECT" keyloom-rust-toolchain
          ./scripts/obs.py wait-sources "$OBS_PROJECT" keyloom-rust-toolchain "keyloom-rust-toolchain_$version-1.dsc"
          ./scripts/obs.py wait-builds "$OBS_PROJECT" keyloom-rust-toolchain
